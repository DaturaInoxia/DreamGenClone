# Verify a built Serverless worker image is pullable from GHCR — exactly what a
# RunPod Serverless endpoint will do.
#
# Runs a REAL `docker pull` on a GitHub runner:
#   1. anonymous (what RunPod does without imageAuth credentials)
#   2. authenticated with GITHUB_TOKEN (what RunPod does if you configure imageAuth)
#
# Usage: Actions -> "verify-serverless-image" -> Run workflow
#   worker:     dwpose | comfy | qwen-edit | qwen-vl
#   image_tag:  the tag that was built (e.g. 0.1.0)

name: verify-serverless-image

on:
  workflow_dispatch:
    inputs:
      worker:
        description: "Worker image to verify"
        required: true
        type: choice
        options:
          - dwpose
          - comfy
          - qwen-edit
          - qwen-vl
      image_tag:
        description: "Image tag to verify (must already be built)"
        required: true
        type: string
        default: "0.1.0"

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Compute image ref
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          REPO_LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          echo "image_ref=${REGISTRY}/${REPO_LOWER}/dreamgen-${{ inputs.worker }}-worker:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - name: Anonymous pull (what RunPod does without imageAuth)
        id: anon
        continue-on-error: true
        run: |
          docker pull "${{ steps.meta.outputs.image_ref }}" 2>&1 | tail -6
          echo "ANON_PULL_EXIT=${PIPESTATUS[0]}"

      - name: Authenticated pull with GITHUB_TOKEN (imageAuth path)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "${{ steps.meta.outputs.image_ref }}" 2>&1 | tail -6
          echo "AUTH_PULL_EXIT=${PIPESTATUS[0]}"
