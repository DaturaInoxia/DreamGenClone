# Build a RunPod Serverless worker image and push it to GHCR.
#
# B-101. Docker is not installed on the dev host, so worker images are built here
# (GitHub Actions runners have Docker) and pushed to GitHub Container Registry, from
# where RunPod Serverless endpoints pull them.
#
# RESTORED 2026-10-03 for the krea2-training worker. The workflow was deleted in 8f18235 as
# "superseded by RunPod GitHub Integration", but that integration can only be driven from the
# RunPod console: the v2 API's POST /v2/serverless takes `image` and nothing else, with
# `unevaluatedProperties: false` rejecting any GitHub-source field, so an endpoint built that way
# cannot be scripted and cannot be recreated from this repo alone. This path can. The only other
# difference from the deleted version is the added `krea2-training` choice.
#
# Usage: Actions -> "build-serverless-worker" -> Run workflow
#   worker:     dwpose | comfy | qwen-edit | qwen-vl | krea2-training
#   image_tag:  e.g. 0.1.0
#
# Build context: helpers/runpod/serverless/<worker>-worker/Dockerfile
# Pushed to:     ghcr.io/<repo>/dreamgen-<worker>-worker:<tag>
#
# After the first push, set the GHCR package visibility to PUBLIC (repo -> Packages ->
# package -> Settings) so the Serverless endpoint can pull it without credentials. If it
# stays private, pass a fine-grained PAT (read:packages) in the endpoint container.imageAuth.

name: build-serverless-worker

on:
  workflow_dispatch:
    inputs:
      worker:
        description: "Worker image to build"
        required: true
        type: choice
        options:
          - dwpose
          - comfy
          - qwen-edit
          - qwen-vl
          - krea2-training
      image_tag:
        description: "Image tag (e.g. 0.1.0)"
        required: true
        type: string
        default: "0.1.0"
  # A push touching the krea2-training worker rebuilds it automatically, so the published image
  # cannot drift from the committed Dockerfile/handler. The other workers stay manual - their paths
  # are not listed, because a surprise 15-20 GB ComfyUI rebuild is not something a random commit
  # should buy.
  push:
    branches: [development]
    paths:
      - "helpers/runpod/serverless/krea2-training-worker/**"
      - ".github/workflows/build-serverless-worker.yml"

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    # The krea2-training image pulls a ~7 GB PyTorch base and adds ~5 GB of musubi deps. The ComfyUI
    # base was 15-20 GB, so this comfortably fits in the freed space below.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # workflow_dispatch supplies worker/tag; a push supplies neither, so fall back to the worker
      # whose path triggered the run. Resolved in shell rather than as `${{ inputs.worker || 'x' }}`
      # so the behaviour does not depend on context availability differing per event type.
      - name: Resolve build inputs
        id: resolve
        env:
          IN_WORKER: ${{ inputs.worker }}
          IN_TAG: ${{ inputs.image_tag }}
        run: |
          WORKER="${IN_WORKER:-krea2-training}"
          TAG="${IN_TAG:-0.1.0}"
          echo "worker=${WORKER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building worker='${WORKER}' tag='${TAG}'"

      # GitHub runners only have ~14 GB free; the base image alone can exceed that.
      # Remove pre-installed toolchains we don't need to make room for the build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/powershell
          df -h / | tail -1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR requires lowercase repo names; GitHub Actions has no lower() function,
      # so compute the image ref in a shell step (tr lowercases).
      - name: Compute image ref
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          REPO_LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          echo "image_ref=${REGISTRY}/${REPO_LOWER}/dreamgen-${{ steps.resolve.outputs.worker }}-worker:${{ steps.resolve.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: helpers/runpod/serverless/${{ steps.resolve.outputs.worker }}-worker
          push: true
          tags: ${{ steps.meta.outputs.image_ref }}
          # Layer cache in the Actions cache. Without it every build re-pulls the ~7 GB PyTorch base
          # and re-runs the whole ~5 GB pip install - the first build took 32 minutes. With it, a
          # handler.py edit only invalidates the final COPY layer, so iteration is ~1-2 minutes.
          # mode=max caches intermediate layers too, which is what the pip layer needs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
